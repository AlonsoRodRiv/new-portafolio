# Simple workflow for deploying static content to GitHub Pages
name: Build & Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Set git config
        run: |
          git config --global user.name "AlonsoRodRiv"
          git config --global user.email "rr14112@ues.edu.sv"

      - name: Deploy to GitHub Pages
        run: npm run vue-deploy-gh-pages -- --repo=https://github.com/AlonsoRodRiv/new-portafolio.git --branch=gh-pages --message="Deploy"
